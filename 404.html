<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - asdasdsdfwe.site</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --text-color: #333;
            --light-text: #7f8c8d;
            --background: #f9fafb;
            --card-bg: #ffffff;
            --border-radius: 6px;
            --box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Segoe UI', Roboto, -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--background);
            color: var(--text-color);
            line-height: 1.6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 650px;
            width: 100%;
            background-color: var(--card-bg);
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            overflow: hidden;
        }
        
        .header {
            background-color: var(--primary-color);
            padding: 25px 40px;
            color: white;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .logo {
            font-weight: 700;
            font-size: 22px;
            letter-spacing: 0.5px;
            margin-bottom: 5px;
        }
        
        .content {
            padding: 40px;
            text-align: center;
        }
        
        .error-illustration {
            margin-bottom: 30px;
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .error-code {
            font-size: 32px;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 10px;
        }
        
        .error-message {
            font-size: 24px;
            font-weight: 500;
            margin-bottom: 20px;
            color: var(--primary-color);
        }
        
        .description {
            color: var(--light-text);
            margin-bottom: 30px;
            font-size: 16px;
            max-width: 480px;
            margin-left: auto;
            margin-right: auto;
        }
        
        .actions {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
        
        .primary-button {
            background-color: var(--accent-color);
            color: white;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 4px;
            font-weight: 500;
            transition: all 0.2s ease;
            min-width: 200px;
        }
        
        .primary-button:hover {
            background-color: #2980b9;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(52, 152, 219, 0.3);
        }
        
        .secondary-links {
            margin-top: 20px;
            color: var(--light-text);
            font-size: 14px;
        }
        
        .secondary-links a {
            color: var(--accent-color);
            text-decoration: none;
            margin: 0 10px;
            transition: color 0.2s;
        }
        
        .secondary-links a:hover {
            color: #2980b9;
            text-decoration: underline;
        }
        
        .footer {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #eee;
            font-size: 13px;
            color: var(--light-text);
        }

        /* SVG styles for the illustration */
        .page-not-found {
            width: 180px;
            height: 180px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">asdasdsdfwe.site</div>
        </div>
        <div class="content">
            <div class="error-illustration">
                <svg class="page-not-found" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M14 2.26953V6.40007C14 6.96012 14 7.24015 14.109 7.45406C14.2049 7.64222 14.3578 7.7952 14.546 7.89108C14.7599 8.00007 15.0399 8.00007 15.6 8.00007H19.7305" stroke="#2c3e50" stroke-width="1.5" stroke-linejoin="round"/>
                    <path d="M8.5 10H12.5" stroke="#3498db" stroke-width="1.5" stroke-linecap="round"/>
                    <path d="M10.5 12H12.5" stroke="#3498db" stroke-width="1.5" stroke-linecap="round"/>
                    <path d="M8.5 14H12.5" stroke="#3498db" stroke-width="1.5" stroke-linecap="round"/>
                    <rect x="4" y="2" width="16" height="20" rx="2" stroke="#2c3e50" stroke-width="1.5"/>
                    <path d="M18 18L21 21M21 18L18 21" stroke="#e74c3c" stroke-width="1.5" stroke-linecap="round"/>
                </svg>
            </div>
            <h1 class="error-code">404</h1>
            <h2 class="error-message">Page Not Found</h2>
            <p class="description">
                We couldn't find the page you were looking for. It might have been removed, renamed, or didn't exist in the first place.
            </p>
            <div class="actions">
                <a href="https://asdasdsdfwe.site" class="primary-button">Return to Homepage</a>
                <div class="secondary-links">
                    <a href="https://asdasdsdfwe.site/contact">Contact Support</a>
                    <a href="https://asdasdsdfwe.site/sitemap">View Sitemap</a>
                </div>
            </div>
            <div class="footer">
                &copy; 2025 asdasdsdfwe.site. All rights reserved.
            </div>
        </div>
    </div>
</body>
</html>
