<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dismos</title>
    <script src="https://www.desmos.com/api/v1.9/calculator.js?apiKey=dcb31709b452b1cf9dc26972add0fda6"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            height: 100vh;
        }

        /* Bottom Bar */
        .top {
            position: fixed;
            bottom: 0;
            width: 100%;
            height: 45px;
            background: #302c2c;
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 0 10px;
            z-index: 1000;
        }

        .top {
            color: white;
        }

        .top input,
        .top button,
        .top select {
            background: white;
            color: black;
        }

        /* Calculator */
        #calculator {
            width: 100%;
            height: calc(100vh - 45px);
        }

        #fileInput {
            display: none;
        }

        /* Save List */
        #saveList {
            position: fixed;
            top: 0;
            bottom: 45px;
            width: 100%;
            background: #444;
            overflow-y: auto;
            display: none;
            z-index: 999;
        }

        .save-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            color: white;
        }

        .save-item input {
            flex: 1;
            margin-right: 10px;
            padding: 5px;
            background: white;
            color: black;
        }

        .save-item button {
            margin: 0 5px;
            padding: 5px 10px;
        }

        .no-saves {
            padding: 20px;
            text-align: center;
            color: white;
        }

        /* Notification */
        .notification {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 15px 20px;
            background: #333;
            color: white;
            z-index: 1100;
            display: none;
        }

        .notification.show {
            display: block;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1200;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-container {
            width: 80%;
            max-width: 900px;
            max-height: 80vh;
            background: #333;
            color: white;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: #222;
        }

        .modal-close {
            padding: 5px;
        }

        .modal-body {
            flex: 1;
            overflow: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
        }

        .editor-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }

        .editor-button {
            padding: 5px 10px;
        }

        .modal-error {
            padding: 10px 0;
            display: none;
        }

        .json-editor {
            flex: 1;
            min-height: 300px;
            padding: 10px;
            background: #1e1e1e;
            color: #f8f8f8;
            resize: none;
            tab-size: 2;
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            padding: 15px 20px;
            background: #222;
        }

        .modal-button {
            padding: 8px 15px;
        }

        /* Mobile */
        @media (max-width: 768px) {
            .top {
                flex-wrap: wrap;
                height: auto;
                min-height: 45px;
                padding: 5px;
            }

            #calculator {
                height: calc(100vh - 55px);
            }

            #saveList {
                bottom: 55px;
            }

            .save-item {
                flex-wrap: wrap;
            }

            .save-item input {
                width: 100%;
                margin-bottom: 10px;
            }

            .modal-container {
                width: 95%;
                max-height: 90vh;
            }
        }
    </style>
</head>
<body>
    <div class="top">
        <input type="text" id="saveName" placeholder="Save Name">
        <button id="createSaveButton">Save New</button>
        <button id="loadSaveButton">Load Save</button>
        <select id="fileOptions">
            <option value="" disabled selected>File Options</option>
            <option value="saveToFile">Save to File</option>
            <option value="loadFromFile">Load from File</option>
        </select>
        <button id="toggleSavesButton">Open Saves</button>
        <input type="file" id="fileInput" accept=".json">
    </div>
    <div id="saveList"></div>
    <div id="calculator"></div>

    <!-- JSON Editor Modal -->
    <div id="jsonEditorModal" class="modal-overlay">
        <div class="modal-container">
            <div class="modal-header">
                <div class="modal-title">Edit JSON State - <span id="editSaveName">Untitled</span></div>
                <button class="modal-close" id="closeModal">&times;</button>
            </div>
            <div class="modal-body">
                <div class="editor-controls">
                    <button class="editor-button" id="formatJson">Format JSON</button>
                    <button class="editor-button" id="minifyJson">Minify JSON</button>
                    <button class="editor-button" id="resetJson">Reset to Original</button>
                </div>
                <div class="modal-error" id="jsonError"></div>
                <textarea id="jsonEditor" class="json-editor" spellcheck="false"></textarea>
            </div>
            <div class="modal-footer">
                <button class="modal-button" id="cancelEdit">Cancel</button>
                <button class="modal-button primary" id="saveJsonChanges">Save Changes</button>
            </div>
        </div>
    </div>

    <script>
        var elt = document.getElementById('calculator');
        var calculator = Desmos.GraphingCalculator(elt);

        let currentEditingSaveName = '';
        let originalJsonState = '';

        // Default ticker config added to any new/loaded graph that doesn't
        // already define one, so the ticker is always available to the user.
        var DEFAULT_TICKER = {
            handlerLatex: '',
            minStepLatex: '0',
            playing: false,
            open: true
        };

        function withDefaultTicker(state) {
            if (!state || !state.expressions) return state;
            if (!state.expressions.ticker) {
                state.expressions.ticker = Object.assign({}, DEFAULT_TICKER);
            }
            return state;
        }

        // Give the fresh, blank graph a ticker as soon as the page loads.
        calculator.setState(withDefaultTicker(calculator.getState()));

        function showNotification(message) {
            const existingNotification = document.querySelector('.notification');
            if (existingNotification) {
                document.body.removeChild(existingNotification);
            }

            const notification = document.createElement('div');
            notification.className = 'notification';
            notification.textContent = message;
            document.body.appendChild(notification);

            setTimeout(() => {
                notification.classList.add('show');
            }, 10);

            setTimeout(() => {
                notification.classList.remove('show');
                setTimeout(() => {
                    if (notification.parentNode) {
                        document.body.removeChild(notification);
                    }
                }, 300);
            }, 3000);
        }

        function updateSaveList() {
            var saveList = document.getElementById('saveList');
            saveList.innerHTML = ''; 

            var saveCount = 0;
            for (var i = 0; i < localStorage.length; i++) {
                var key = localStorage.key(i);
                if (key.startsWith('desmosState_')) {
                    saveCount++;
                    var saveName = key.replace('desmosState_', '');
                    var saveItem = document.createElement('div');
                    saveItem.className = 'save-item';

                    var saveInput = document.createElement('input');
                    saveInput.type = 'text';
                    saveInput.value = saveName;
                    saveInput.dataset.originalName = saveName;
                    saveItem.appendChild(saveInput);

                    var buttonContainer = document.createElement('div');
                    buttonContainer.className = 'button-container';

                    var loadButton = document.createElement('button');
                    loadButton.textContent = 'Load';
                    loadButton.addEventListener('click', function(saveName) {
                        return function() {
                            var savedState = localStorage.getItem('desmosState_' + saveName);
                            if (savedState) {
                                try {
                                    calculator.setState(withDefaultTicker(JSON.parse(savedState)));
                                    showNotification('Loaded "' + saveName + '"');
                                } catch (error) {
                                    showNotification('Error loading save: ' + error.message);
                                }
                            }
                        };
                    }(saveName));
                    buttonContainer.appendChild(loadButton);

                    var overrideButton = document.createElement('button');
                    overrideButton.textContent = 'Override';
                    overrideButton.addEventListener('click', function(saveName) {
                        return function() {
                            if (confirm('Are you sure you want to override "' + saveName + '"?')) {
                                try {
                                    var state = calculator.getState();
                                    localStorage.setItem('desmosState_' + saveName, JSON.stringify(state));
                                    showNotification('Overridden save "' + saveName + '"');
                                } catch (error) {
                                    showNotification('Error saving: ' + error.message);
                                }
                            }
                        };
                    }(saveName));
                    buttonContainer.appendChild(overrideButton);

                    var deleteButton = document.createElement('button');
                    deleteButton.textContent = 'Delete';
                    deleteButton.addEventListener('click', function(saveName) {
                        return function() {
                            if (confirm('Are you sure you want to delete "' + saveName + '"?')) {
                                localStorage.removeItem('desmosState_' + saveName);
                                showNotification('Deleted save "' + saveName + '"');
                                updateSaveList();
                            }
                        };
                    }(saveName));
                    buttonContainer.appendChild(deleteButton);

                    var editButton = document.createElement('button');
                    editButton.textContent = 'Rename';
                    editButton.addEventListener('click', function(oldName, inputElement) {
                        return function() {
                            var newName = inputElement.value.trim();
                            if (newName && newName !== oldName) {
                                if (localStorage.getItem('desmosState_' + newName)) {
                                    showNotification('A save with this name already exists.');
                                    inputElement.value = oldName;
                                } else {
                                    try {
                                        var savedState = localStorage.getItem('desmosState_' + oldName);
                                        localStorage.setItem('desmosState_' + newName, savedState);
                                        localStorage.removeItem('desmosState_' + oldName);
                                        showNotification('Renamed "' + oldName + '" to "' + newName + '"');
                                        inputElement.dataset.originalName = newName;
                                        updateSaveList();
                                    } catch (error) {
                                        showNotification('Error renaming: ' + error.message);
                                    }
                                }
                            } else if (newName === oldName) {
                                showNotification('No change detected.');
                            } else {
                                showNotification('Please enter a valid name.');
                                inputElement.value = oldName;
                            }
                        };
                    }(saveName, saveInput));
                    buttonContainer.appendChild(editButton);

                    var jsonEditButton = document.createElement('button');
                    jsonEditButton.textContent = 'Edit JSON';
                    jsonEditButton.addEventListener('click', function(saveName) {
                        return function() {
                            openJsonEditor(saveName);
                        };
                    }(saveName));
                    buttonContainer.appendChild(jsonEditButton);

                    saveItem.appendChild(buttonContainer);
                    saveList.appendChild(saveItem);
                }
            }

            if (saveCount === 0) {
                var noSaves = document.createElement('div');
                noSaves.className = 'no-saves';
                noSaves.textContent = 'No saved graphs found. Create a new save to get started.';
                saveList.appendChild(noSaves);
            }
        }

        function openJsonEditor(saveName) {
            currentEditingSaveName = saveName;
            document.getElementById('editSaveName').textContent = saveName;

            try {
                const savedState = localStorage.getItem('desmosState_' + saveName);
                if (savedState) {
                    const jsonObj = JSON.parse(savedState);
                    originalJsonState = savedState;
                    const formattedJson = JSON.stringify(jsonObj, null, 2);

                    document.getElementById('jsonEditor').value = formattedJson;
                    document.getElementById('jsonEditorModal').classList.add('active');
                    document.getElementById('jsonError').style.display = 'none';

                    setTimeout(() => {
                        document.getElementById('jsonEditor').focus();
                    }, 100);
                }
            } catch (error) {
                showNotification('Error loading JSON: ' + error.message);
            }
        }

        function closeJsonEditor() {
            document.getElementById('jsonEditorModal').classList.remove('active');
            currentEditingSaveName = '';
            originalJsonState = '';
        }

        document.getElementById('formatJson').addEventListener('click', function() {
            const editor = document.getElementById('jsonEditor');
            try {
                const jsonObj = JSON.parse(editor.value);
                editor.value = JSON.stringify(jsonObj, null, 2);
                document.getElementById('jsonError').style.display = 'none';
            } catch (error) {
                document.getElementById('jsonError').textContent = 'Invalid JSON: ' + error.message;
                document.getElementById('jsonError').style.display = 'block';
            }
        });

        document.getElementById('minifyJson').addEventListener('click', function() {
            const editor = document.getElementById('jsonEditor');
            try {
                const jsonObj = JSON.parse(editor.value);
                editor.value = JSON.stringify(jsonObj);
                document.getElementById('jsonError').style.display = 'none';
            } catch (error) {
                document.getElementById('jsonError').textContent = 'Invalid JSON: ' + error.message;
                document.getElementById('jsonError').style.display = 'block';
            }
        });

        document.getElementById('resetJson').addEventListener('click', function() {
            if (originalJsonState) {
                try {
                    const jsonObj = JSON.parse(originalJsonState);
                    document.getElementById('jsonEditor').value = JSON.stringify(jsonObj, null, 2);
                    document.getElementById('jsonError').style.display = 'none';
                } catch (error) {
                    document.getElementById('jsonError').textContent = 'Error resetting JSON: ' + error.message;
                    document.getElementById('jsonError').style.display = 'block';
                }
            }
        });

        document.getElementById('saveJsonChanges').addEventListener('click', function() {
            if (!currentEditingSaveName) return;

            const jsonEditor = document.getElementById('jsonEditor');
            try {
                const jsonObj = JSON.parse(jsonEditor.value);
                localStorage.setItem('desmosState_' + currentEditingSaveName, JSON.stringify(jsonObj));

                const currentState = calculator.getState();
                if (JSON.stringify(currentState) === originalJsonState) {
                    calculator.setState(jsonObj);
                }

                showNotification('JSON changes saved for "' + currentEditingSaveName + '"');
                closeJsonEditor();
            } catch (error) {
                document.getElementById('jsonError').textContent = 'Invalid JSON: ' + error.message;
                document.getElementById('jsonError').style.display = 'block';
            }
        });

        document.getElementById('cancelEdit').addEventListener('click', closeJsonEditor);
        document.getElementById('closeModal').addEventListener('click', closeJsonEditor);

        document.getElementById('jsonEditorModal').addEventListener('click', function(event) {
            if (event.target === this) {
                closeJsonEditor();
            }
        });

        document.getElementById('createSaveButton').addEventListener('click', function() {
            var saveName = document.getElementById('saveName').value.trim();
            if (saveName) {
                if (localStorage.getItem('desmosState_' + saveName)) {
                    if (confirm('A save with this name already exists. Do you want to override it?')) {
                        try {
                            var state = calculator.getState();
                            localStorage.setItem('desmosState_' + saveName, JSON.stringify(state));
                            showNotification('Overridden save "' + saveName + '"');
                        } catch (error) {
                            showNotification('Error saving: ' + error.message);
                        }
                    }
                } else {
                    try {
                        var state = calculator.getState();
                        localStorage.setItem('desmosState_' + saveName, JSON.stringify(state));
                        showNotification('Saved as "' + saveName + '"');
                    } catch (error) {
                        showNotification('Error saving: ' + error.message);
                    }
                }
                updateSaveList();
            } else {
                showNotification('Please enter a name for the save.');
            }
        });

        document.getElementById('loadSaveButton').addEventListener('click', function() {
            var saveName = document.getElementById('saveName').value.trim();
            if (saveName) {
                var savedState = localStorage.getItem('desmosState_' + saveName);
                if (savedState) {
                    try {
                        calculator.setState(withDefaultTicker(JSON.parse(savedState)));
                        showNotification('Loaded "' + saveName + '"');
                    } catch (error) {
                        showNotification('Error loading save: ' + error.message);
                    }
                } else {
                    showNotification('No save found with the name "' + saveName + '"');
                }
            } else {
                showNotification('Please enter a name to load.');
            }
        });

        document.getElementById('toggleSavesButton').addEventListener('click', function() {
            var saveList = document.getElementById('saveList');
            if (saveList.style.display === 'none' || saveList.style.display === '') {
                updateSaveList(); 
                saveList.style.display = 'block';
                this.textContent = 'Close Saves';
            } else {
                saveList.style.display = 'none';
                this.textContent = 'Open Saves';
            }
        });

        document.getElementById('fileOptions').addEventListener('change', function() {
            var option = this.value;
            if (option === 'saveToFile') {
                var saveName = document.getElementById('saveName').value.trim() || 'desmosState';
                try {
                    var state = calculator.getState();
                    var blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
                    var a = document.createElement('a');
                    a.href = URL.createObjectURL(blob);
                    a.download = saveName + '.json';
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    showNotification('Saved to file: ' + saveName + '.json');
                } catch (error) {
                    showNotification('Error saving to file: ' + error.message);
                }
            } else if (option === 'loadFromFile') {
                document.getElementById('fileInput').click();
            }
            this.value = ''; 
        });

        document.getElementById('fileInput').addEventListener('change', function(event) {
            var file = event.target.files[0];
            if (file) {
                var reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        var state = JSON.parse(e.target.result);
                        calculator.setState(withDefaultTicker(state));
                        showNotification('Loaded state from file: ' + file.name);

                        var fileName = file.name.replace(/\.[^/.]+$/, "");
                        document.getElementById('saveName').value = fileName;
                    } catch (error) {
                        showNotification('Error loading file: ' + error.message);
                    }
                };
                reader.readAsText(file);
            }
        });

        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape') {
                if (document.getElementById('jsonEditorModal').classList.contains('active')) {
                    closeJsonEditor();
                } else if (document.getElementById('saveList').style.display === 'block') {
                    document.getElementById('toggleSavesButton').click();
                }
            }

            if ((event.ctrlKey || event.metaKey) && event.key === 's') {
                event.preventDefault();

                if (document.getElementById('jsonEditorModal').classList.contains('active')) {
                    document.getElementById('saveJsonChanges').click();
                } else {
                    document.getElementById('createSaveButton').click();
                }
            }

            if (event.key === 'Tab' && document.getElementById('jsonEditorModal').classList.contains('active')) {
                const editor = document.getElementById('jsonEditor');
                if (document.activeElement === editor) {
                    event.preventDefault();
                    const start = editor.selectionStart;
                    const end = editor.selectionEnd;

                    editor.value = editor.value.substring(0, start) + '  ' + editor.value.substring(end);

                    editor.selectionStart = editor.selectionEnd = start + 2;
                }
            }
        });

        updateSaveList();

        window.addEventListener('load', function() {
            try {
                var autoSave = localStorage.getItem('desmosState_AutoSave');
                if (autoSave && calculator.getState().expressions.list.length === 0) {
                    calculator.setState(withDefaultTicker(JSON.parse(autoSave)));
                    showNotification('Recovered from auto-save');
                }
            } catch (error) {
                console.error('Error recovering auto-save:', error);
            }
        });

        setInterval(function() {
            try {
                var state = calculator.getState();
                if (state.expressions.list.length > 0) {
                    localStorage.setItem('desmosState_AutoSave', JSON.stringify(state));
                }
            } catch (error) {
                console.error('Error creating auto-save:', error);
            }
        }, 60000);
    </script>
</body>
</html>
