<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Countdown To School's End 2026</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background-color: #f0f0f0;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  padding: 20px;
}

#countdown-container {
  background-color: white;
  padding: 40px;
  border-radius: 10px;
  box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
  text-align: center;
  max-width: 800px;
  width: 100%;
}

#countdown-title {
  font-size: 2.5rem;
  color: #333;
  margin-bottom: 30px;
  font-weight: bold;
}

#countdown {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 20px;
}

.time-segment {
  display: flex;
  flex-direction: column;
  align-items: center;
}

.time-number {
  font-size: 3rem;
  font-weight: bold;
  color: #333;
  background-color: #e8e8e8;
  padding: 20px 30px;
  border-radius: 8px;
  min-width: 100px;
  margin-bottom: 10px;
}

.time-label {
  font-size: 1rem;
  color: #666;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.colorSelectors {
  position: fixed;
  bottom: 20px;
  left: 20px;
  display: flex;
  gap: 20px;
  background-color: white;
  padding: 15px;
  border-radius: 8px;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
}

.colorSelectorWrapper {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}

.colorLabels {
  font-size: 12px;
  color: #333;
  font-weight: bold;
}

.colorSelector {
  width: 50px;
  height: 50px;
  border: 2px solid #ccc;
  border-radius: 5px;
  cursor: pointer;
}

@media (max-width: 768px) {
  #countdown-title {
    font-size: 1.8rem;
  }
  
  .time-number {
    font-size: 2rem;
    padding: 15px 20px;
    min-width: 80px;
  }
  
  .colorSelectors {
    left: 10px;
    bottom: 10px;
    gap: 10px;
    padding: 10px;
  }
}
</style>
</head>
<body>

<div id="countdown-container">
  <div id="countdown-title">School's End Countdown</div>
  <div id="countdown">
    <div class="time-segment">
      <span id="days" class="time-number">00</span>
      <span class="time-label">days</span>
    </div>
    <div class="time-segment">
      <span id="hours" class="time-number">00</span>
      <span class="time-label">hours</span>
    </div>
    <div class="time-segment">
      <span id="minutes" class="time-number">00</span>
      <span class="time-label">minutes</span>
    </div>
    <div class="time-segment">
      <span id="seconds" class="time-number">00</span>
      <span class="time-label">seconds</span>
    </div>
  </div>
</div>

<div class="colorSelectors">
  <div class="colorSelectorWrapper">
    <label for="textColor" class="colorLabels" id="textLabel">Text</label>
    <input type="color" class="colorSelector" id="textColor" value="#000000">
  </div>
  <div class="colorSelectorWrapper">
    <label for="bgColor" class="colorLabels" id="bgLabel">Background</label>
    <input type="color" class="colorSelector" id="bgColor" value="#f0f0f0">
  </div>
  <div class="colorSelectorWrapper">
    <label for="containerColor" class="colorLabels" id="containerLabel">Container</label>
    <input type="color" class="colorSelector" id="containerColor" value="#ffffff">
  </div>
  <div class="colorSelectorWrapper">
    <label for="numberColor" class="colorLabels" id="numberLabel">Numbers</label>
    <input type="color" class="colorSelector" id="numberColor" value="#e8e8e8">
  </div>
</div>

<script>
function setColors(textColor, bgColor, containerColor, numberBgColor) {
  document.getElementById("countdown-container").style.color = textColor;
  document.getElementById("countdown-title").style.color = textColor;
  document.getElementById("countdown-container").style.backgroundColor = containerColor;

  const timeNumbers = document.querySelectorAll('.time-number');
  timeNumbers.forEach(el => {
    el.style.color = textColor;
    el.style.backgroundColor = numberBgColor;
  });

  document.body.style.backgroundColor = bgColor;
  document.body.style.backgroundImage = 'none';

  document.getElementById("textLabel").style.color = textColor;
  document.getElementById("bgLabel").style.color = textColor;
  document.getElementById("containerLabel").style.color = textColor;
  document.getElementById("numberLabel").style.color = textColor;
}

var countDownDate = new Date("May 21, 2026 00:00:00").getTime();

var x = setInterval(function() {
  var now = new Date().getTime();
  var distance = countDownDate - now;

  var days = Math.floor(distance / (1000 * 60 * 60 * 24));
  var hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
  var minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
  var seconds = Math.floor((distance % (1000 * 60)) / 1000);

  days = days < 10 ? "0" + days : days;
  hours = hours < 10 ? "0" + hours : hours;
  minutes = minutes < 10 ? "0" + minutes : minutes;
  seconds = seconds < 10 ? "0" + seconds : seconds;

  document.getElementById("days").textContent = days;
  document.getElementById("hours").textContent = hours;
  document.getElementById("minutes").textContent = minutes;
  document.getElementById("seconds").textContent = seconds;

  if (distance < 0) {
    clearInterval(x);
    document.getElementById("countdown-container").innerHTML = "<div style='font-size: 5vw; text-align: center;'>School Is Out!</div>";
  }
}, 1000);

document.getElementById("textColor").addEventListener("input", function() {
  var textColor = this.value;
  var bgColor = document.getElementById("bgColor").value;
  var containerColor = document.getElementById("containerColor").value;
  var numberBgColor = document.getElementById("numberColor").value;
  setColors(textColor, bgColor, containerColor, numberBgColor);
});

document.getElementById("bgColor").addEventListener("input", function() {
  var textColor = document.getElementById("textColor").value;
  var bgColor = this.value;
  var containerColor = document.getElementById("containerColor").value;
  var numberBgColor = document.getElementById("numberColor").value;
  setColors(textColor, bgColor, containerColor, numberBgColor);
});

document.getElementById("containerColor").addEventListener("input", function() {
  var textColor = document.getElementById("textColor").value;
  var bgColor = document.getElementById("bgColor").value;
  var containerColor = this.value;
  var numberBgColor = document.getElementById("numberColor").value;
  setColors(textColor, bgColor, containerColor, numberBgColor);
});

document.getElementById("numberColor").addEventListener("input", function() {
  var textColor = document.getElementById("textColor").value;
  var bgColor = document.getElementById("bgColor").value;
  var containerColor = document.getElementById("containerColor").value;
  var numberBgColor = this.value;
  setColors(textColor, bgColor, containerColor, numberBgColor);
});
</script>

</body>
</html>
