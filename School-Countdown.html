<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" href="./Images/favicon.ico" type="image/x-icon">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Countdown To School's End 2025</title>
<style>
  body {
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background-color: #f0f0f0;
    position: relative;
    transition: background 0.5s ease;
    font-family: 'Arial', sans-serif;
  }

  #countdown-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    background-color: rgba(255, 255, 255, 0.2);
    padding: 2rem;
    border-radius: 15px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
  }

  #countdown-title {
    font-size: 2vw;
    margin-bottom: 1rem;
    text-transform: uppercase;
    letter-spacing: 2px;
  }

  #countdown {
    font-size: 5vw;
    text-align: center;
    font-weight: bold;
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
  }

  .time-segment {
    margin: 0 10px;
    text-align: center;
  }

  .time-number {
    display: block;
    background-color: rgba(0, 0, 0, 0.1);
    padding: 10px 15px;
    border-radius: 10px;
    min-width: 80px;
    margin-bottom: 5px;
  }

  .time-label {
    font-size: 1vw;
    display: block;
    text-transform: uppercase;
  }

  .colorSelectors {
    position: absolute;
    bottom: 20px;
    right: 20px;
    display: flex;
    flex-direction: row;
    background-color: rgba(255, 255, 255, 0.3);
    padding: 10px;
    border-radius: 10px;
  }

  .colorSelectorWrapper {
    position: relative;
    margin-right: 15px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .colorSelectorWrapper:last-child {
    margin-right: 0;
  }

  .colorSelector {
    width: 40px;
    height: 40px;
    padding: 0;
    border: none;
    border-radius: 50%;
    cursor: pointer;
    outline: none;
    background: transparent;
    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
    transition: transform 0.2s;
  }

  .colorSelector:hover {
    transform: scale(1.1);
  }

  .colorLabels {
    margin-bottom: 5px;
    color: #333;
    font-size: 12px;
    font-weight: bold;
  }

  .theme-selector {
    position: absolute;
    bottom: 20px;
    left: 20px;
    background-color: rgba(255, 255, 255, 0.3);
    padding: 10px;
    border-radius: 10px;
  }

  .theme-button {
    background: none;
    border: none;
    cursor: pointer;
    margin: 0 5px;
    padding: 8px 15px;
    border-radius: 5px;
    font-weight: bold;
    transition: all 0.3s;
  }

  .theme-button:hover {
    background-color: rgba(255, 255, 255, 0.4);
  }

  .events {
    position: absolute;
    top: 20px;
    left: 20px;
    display: inline-block;
    transition-duration: 500ms;
    background-color: rgba(255, 255, 255, 0.3);
    padding: 8px;
    border-radius: 10px;
  }

  .events-icon {
    width: 35px;
    height: 35px;
    text-align: center;
    font-size: 12px;
    border-radius: 5px;
    transition-duration: 500ms;
  }

  .events:hover {
    transform: scale(1.1);
  }

  .events:hover::after {
    content: "Events Page";
    position: absolute;
    top: -30px;
    left: 0;
    background-color: rgba(0, 0, 0, 0.7);
    color: white;
    padding: 5px 10px;
    border-radius: 5px;
    font-size: 12px;
    white-space: nowrap;
  }
</style>
</head>
<body>
<a href="./Event-Countdown.html" class="events">
  <img src="./Images/android-chrome-192x192.png" width="35px" class="events-icon">
</a>

<div id="countdown-container">
  <div id="countdown-title">School's End Countdown</div>
  <div id="countdown">
    <div class="time-segment">
      <span id="days" class="time-number">00</span>
      <span class="time-label">days</span>
    </div>
    <div class="time-segment">
      <span id="hours" class="time-number">00</span>
      <span class="time-label">hours</span>
    </div>
    <div class="time-segment">
      <span id="minutes" class="time-number">00</span>
      <span class="time-label">minutes</span>
    </div>
    <div class="time-segment">
      <span id="seconds" class="time-number">00</span>
      <span class="time-label">seconds</span>
    </div>
  </div>
</div>

<div class="colorSelectors">
  <div class="colorSelectorWrapper">
    <label for="textColor" class="colorLabels" id="textLabel">Text</label>
    <input type="color" class="colorSelector" id="textColor" value="#000000">
  </div>
  <div class="colorSelectorWrapper">
    <label for="bgColor" class="colorLabels" id="bgLabel">Background</label>
    <input type="color" class="colorSelector" id="bgColor" value="#f0f0f0">
  </div>
</div>

<div class="theme-selector">
  <button class="theme-button" id="theme1">Blue</button>
  <button class="theme-button" id="theme2">Green</button>
  <button class="theme-button" id="theme3">Dark</button>
</div>

<script>
// Function to set the countdown text color and background color
function setColors(textColor, bgColor) {
  document.getElementById("countdown-container").style.color = textColor;
  document.getElementById("countdown-title").style.color = textColor;
  
  // Update all time segments with the text color
  const timeNumbers = document.querySelectorAll('.time-number');
  timeNumbers.forEach(el => {
    el.style.color = textColor;
  });
  
  // Update body background
  document.body.style.backgroundColor = bgColor;
  
  // Update labels color
  document.getElementById("textLabel").style.color = textColor;
  document.getElementById("bgLabel").style.color = textColor;
  
  // Save to localStorage
  localStorage.setItem("textColor", textColor);
  localStorage.setItem("bgColor", bgColor);
}

// Function to update colors when the page loads
function updateColors() {
  var savedTextColor = localStorage.getItem("textColor");
  var savedBgColor = localStorage.getItem("bgColor");
  if (savedTextColor && savedBgColor) {
    document.getElementById("textColor").value = savedTextColor;
    document.getElementById("bgColor").value = savedBgColor;
    setColors(savedTextColor, savedBgColor);
  }
}

// Set the date we're counting down to
var countDownDate = new Date("May 22, 2025 00:00:00").getTime();

// Update the countdown every 1 second
var x = setInterval(function() {
  // Get the current date and time
  var now = new Date().getTime();
  
  // Find the distance between now and the countdown date
  var distance = countDownDate - now;
  
  // Calculate days, hours, minutes, and seconds remaining
  var days = Math.floor(distance / (1000 * 60 * 60 * 24));
  var hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
  var minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
  var seconds = Math.floor((distance % (1000 * 60)) / 1000);
  
  // Add leading zeros if necessary
  days = days < 10 ? "0" + days : days;
  hours = hours < 10 ? "0" + hours : hours;
  minutes = minutes < 10 ? "0" + minutes : minutes;
  seconds = seconds < 10 ? "0" + seconds : seconds;
  
  // Display each part in its own element
  document.getElementById("days").textContent = days;
  document.getElementById("hours").textContent = hours;
  document.getElementById("minutes").textContent = minutes;
  document.getElementById("seconds").textContent = seconds;
  
  // If the countdown is over, display a message
  if (distance < 0) {
    clearInterval(x);
    document.getElementById("countdown-container").innerHTML = "<div style='font-size: 5vw; text-align: center;'>School Is Out!</div>";
  }
}, 1000);

// Event listeners to update colors when the input changes
document.getElementById("textColor").addEventListener("input", function() {
  var textColor = this.value;
  var bgColor = document.getElementById("bgColor").value;
  setColors(textColor, bgColor);
});

document.getElementById("bgColor").addEventListener("input", function() {
  var textColor = document.getElementById("textColor").value;
  var bgColor = this.value;
  setColors(textColor, bgColor);
});

// Theme presets with solid colors
document.getElementById("theme1").addEventListener("click", function() {
  setColors("#ffffff", "#3498db");
  document.getElementById("textColor").value = "#ffffff";
  document.getElementById("bgColor").value = "#3498db";
  localStorage.setItem("theme", "theme1");
});

document.getElementById("theme2").addEventListener("click", function() {
  setColors("#ffffff", "#2ecc71");
  document.getElementById("textColor").value = "#ffffff";
  document.getElementById("bgColor").value = "#2ecc71";
  localStorage.setItem("theme", "theme2");
});

document.getElementById("theme3").addEventListener("click", function() {
  setColors("#ffffff", "#2c3e50");
  document.getElementById("textColor").value = "#ffffff";
  document.getElementById("bgColor").value = "#2c3e50";
  localStorage.setItem("theme", "theme3");
});

// Load saved theme if exists
window.onload = function() {
  updateColors();
  
  const savedTheme = localStorage.getItem("theme");
  if (savedTheme) {
    document.getElementById(savedTheme).click();
  }
};
</script>

</body>
</html>
