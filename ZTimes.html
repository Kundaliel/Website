<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Zones!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #222;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 10px;
            width: 100%;
            height: 100%;
            padding: 10px;
        }
        .box {
            background: #333;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 8px;
            border: 1px solid #555;
            font-size: 1.5rem;
        }
        .time-zone {
            font-weight: bold;
            font-size: 1.8rem;
            margin-bottom: 10px;
        }
        .time {
            font-size: 1.2rem;
            color: #bbb;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <div class="grid">
        <div class="box">
            <div class="time-zone">GMT-8</div>
            MinebotUltra
            <div class="time" id="gmtMinus8"></div>
        </div>
        <div class="box">
            <div class="time-zone">GMT-6</div>
            Emiluu, SilentSkiess
            <div class="time" id="gmtMinus6"></div>
        </div>
        <div class="box">
            <div class="time-zone">GMT-5</div>
            Kundaliel, IslandsForLife
            <div class="time" id="gmtMinus5"></div>
        </div>
        <div class="box">
            <div class="time-zone">GMT+8</div>
            Siqns
            <div class="time" id="gmtPlus8"></div>
        </div>
    </div>

    <script>
        function updateTime() {
            const timeZones = [
                { id: "gmtMinus8", offset: -8 },
                { id: "gmtMinus6", offset: -6 },
                { id: "gmtMinus5", offset: -5 },
                { id: "gmtPlus8", offset: 8 }
            ];
            
            timeZones.forEach(zone => {
                let now = new Date();
                let utc = now.getTime() + now.getTimezoneOffset() * 60000;
                let time = new Date(utc + (3600000 * zone.offset));
                document.getElementById(zone.id).innerText = time.toLocaleTimeString();
            });
        }

        updateTime();
        setInterval(updateTime, 0);
    </script>

</body>
</html>
