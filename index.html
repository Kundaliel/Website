<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" href="./Images/favicon.ico" type="image/x-icon">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Navigation menu for web applications and tools">
    <title>Menu</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            transition: background 0.3s ease;
        }

        body.dark-mode {
            background: #1a1a1a;
        }

        .container {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            max-width: 800px;
            width: 100%;
            padding: 40px;
            position: relative;
            transition: background 0.3s ease, color 0.3s ease;
        }

        body.dark-mode .container {
            background: #2a2a2a;
            color: #e8e8e8;
        }

        .theme-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #333;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .theme-toggle:hover {
            background: #555;
        }

        .theme-toggle i {
            color: white;
            font-size: 18px;
        }

        body.dark-mode .theme-toggle {
            background: #444;
        }

        body.dark-mode .theme-toggle:hover {
            background: #666;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 2.5rem;
            color: #333;
            margin-bottom: 10px;
            font-weight: 700;
        }

        body.dark-mode h1 {
            color: #e8e8e8;
        }

        .subtitle {
            color: #666;
            font-size: 1rem;
        }

        body.dark-mode .subtitle {
            color: #b8b8b8;
        }

        .menu {
            list-style: none;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .menu-item a {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
            text-decoration: none;
            color: #333;
            transition: all 0.2s ease;
            border: 1px solid #e0e0e0;
        }

        body.dark-mode .menu-item a {
            background: #333;
            color: #e8e8e8;
            border-color: #444;
        }

        .menu-item a:hover {
            background: #e9ecef;
            border-color: #333;
        }

        body.dark-mode .menu-item a:hover {
            background: #3a3a3a;
            border-color: #666;
        }

        .icon {
            width: 45px;
            height: 45px;
            background: #333;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        body.dark-mode .icon {
            background: #444;
        }

        .icon i {
            color: white;
            font-size: 1.5rem;
        }

        .menu-item span:not(.icon) {
            font-size: 1.1rem;
            font-weight: 500;
        }

        footer {
            text-align: center;
            padding-top: 20px;
            border-top: 2px solid #e0e0e0;
            color: #666;
        }

        body.dark-mode footer {
            border-top-color: #1a1a2e;
            color: #b8b8b8;
        }

        @media (max-width: 600px) {
            .container {
                padding: 30px 20px;
            }

            h1 {
                font-size: 2rem;
            }

            .menu {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <button class="theme-toggle" aria-label="Toggle dark mode">
            <i class="fas fa-moon"></i>
        </button>

        <header>
            <h1>Menu</h1>
            <p class="subtitle">Select a tool or application to navigate</p>
        </header>

        <nav>
            <ul class="menu" role="menu">
                <li class="menu-item" role="menuitem">
                    <a href="./suffix.html" aria-label="Navigate to Suffix">
                        <span class="icon"><i class="fas fa-font"></i></span>
                        <span>Suffix</span>
                    </a>
                </li>
                <li class="menu-item" role="menuitem">
                    <a href="./School-Countdown.html" aria-label="Navigate to School Countdown">
                        <span class="icon"><i class="fas fa-school"></i></span>
                        <span>School Countdown</span>
                    </a>
                </li>
                <li class="menu-item" role="menuitem">
                    <a href="./Dismos.html" aria-label="Navigate to Dismos">
                        <span class="icon"><i class="fas fa-chart-line"></i></span>
                        <span>Dismos</span>
                    </a>
                </li>
                <li class="menu-item" role="menuitem">
                    <a href="./Saves.html" aria-label="Navigate to Saves">
                        <span class="icon"><i class="fas fa-save"></i></span>
                        <span>Saves</span>
                    </a>
                </li>
                <li class="menu-item" role="menuitem">
                    <a href="./Times.html" aria-label="Navigate to Block Information">
                        <span class="icon"><i class="fas fa-clock"></i></span>
                        <span>Block Information</span>
                    </a>
                </li>
                <li class="menu-item" role="menuitem">
                    <a href="./Mandelbrot.html" aria-label="Navigate to Mandelbrot Set">
                        <span class="icon"><i class="fas fa-square-root-alt"></i></span>
                        <span>Mandelbrot Set</span>
                    </a>
                </li>
                <li class="menu-item" role="menuitem">
                    <a href="./v3/index.html" aria-label="Navigate to EdPy V3">
                        <span class="icon"><i class="fas fa-code"></i></span>
                        <span>EdPy V3</span>
                    </a>
                </li>
            </ul>
        </nav>

        <footer>
            <p>Select an option to explore features</p>
        </footer>
    </div>

    <script>
        const themeToggle = document.querySelector('.theme-toggle');
        const themeIcon = themeToggle.querySelector('i');

        function toggleDarkMode() {
            const isDarkMode = document.body.classList.toggle('dark-mode');

            if (isDarkMode) {
                themeIcon.classList.remove('fa-moon');
                themeIcon.classList.add('fa-sun');
            } else {
                themeIcon.classList.remove('fa-sun');
                themeIcon.classList.add('fa-moon');
            }

            localStorage.setItem('darkMode', isDarkMode ? 'enabled' : 'disabled');
        }

        themeToggle.addEventListener('click', toggleDarkMode);

        const savedDarkMode = localStorage.getItem('darkMode');

        if (savedDarkMode === 'enabled') {
            document.body.classList.add('dark-mode');
            themeIcon.classList.remove('fa-moon');
            themeIcon.classList.add('fa-sun');
        }
    </script>
</body>
</html>
